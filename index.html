<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:," />
    <title>Pane Steward</title>
    <style>
      :root {
        --hud-fs: 15px;
        --speech-fs: 16px;
        --chip-fs: 13px;
        --mute: #9aa3b5;
        --ink: #eef2f8;
        --btn-bg: #222938ee;
        --btn-border: #6b7cff;
        --pane-bg: #141820ee;
        --speech-bg: #0007;
        --reason: #ffd27a;
        --keep-border: #5ad67a;
        --keep-ink: #b8ffcb;
        --undo-border: #ff8a5b;
        --undo-ink: #ffc7b0;
        --mode-border: #5a7cff;
        --mode-ink: #c9d4ff;
        --mode-bg: #1a2030cc;
      }
      html.hc {
        --mute: #ffffff;
        --ink: #ffffff;
        --btn-bg: #000000;
        --btn-border: #ffff66;
        --pane-bg: #000000;
        --speech-bg: #000000;
        --reason: #ffff66;
        --keep-border: #00ff66;
        --keep-ink: #00ff66;
        --undo-border: #ff9933;
        --undo-ink: #ff9933;
        --mode-border: #ffff66;
        --mode-ink: #ffffff;
        --mode-bg: #000000;
      }
      html.ts-0 { --hud-fs: 13px; --speech-fs: 14px; --chip-fs: 12px; }
      html.ts-1 { --hud-fs: 15px; --speech-fs: 16px; --chip-fs: 13px; }
      html.ts-2 { --hud-fs: 18px; --speech-fs: 19px; --chip-fs: 15px; }

      html,body{margin:0;height:100%;background:#0f1218;font-family:Inter,system-ui,sans-serif;overflow:hidden;color:var(--ink)}
      html.hc,html.hc body{background:#000}
      #scene-container{position:fixed;inset:0}
      #hud{position:fixed;inset:0;pointer-events:none;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;gap:10px;box-sizing:border-box;font-size:var(--hud-fs)}
      #hud *{pointer-events:auto}
      #mode-chip{position:fixed;top:14px;left:14px;z-index:30;background:var(--mode-bg);border:1px solid var(--mode-border);color:var(--mode-ink);border-radius:999px;padding:6px 12px;font-size:var(--chip-fs);backdrop-filter:blur(8px)}
      #privacy{position:fixed;top:14px;right:14px;z-index:30;max-width:240px;text-align:right;font-size:11px;color:var(--mute);line-height:1.35}
      #top-bar{position:fixed;top:48px;left:14px;z-index:30;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      #a11y-bar{display:flex;gap:6px;align-items:center}
      /* Primary targets ≥48 CSS px (≈48dp) */
      #top-bar button,#chat-bar button,#chips button,#keep-row button,#a11y-bar button{
        background:var(--btn-bg);color:var(--ink);border:1px solid var(--btn-border);border-radius:16px;
        padding:12px 16px;font-size:var(--hud-fs);cursor:pointer;min-height:48px;min-width:48px;line-height:1.2
      }
      #top-bar button:hover,#chat-bar button:hover,#chips button:hover,#keep-row button:hover,#a11y-bar button:hover{filter:brightness(1.15)}
      #a11y-bar button[aria-pressed="true"]{outline:2px solid var(--reason);outline-offset:2px}
      #chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
      #chat-bar{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto;width:100%}
      #chat-input{flex:1;min-height:48px;border-radius:16px;border:1px solid var(--btn-border);background:var(--pane-bg);color:var(--ink);padding:10px 14px;font-size:var(--hud-fs)}
      #reason{text-align:center;font-size:calc(var(--hud-fs) - 1px);color:var(--reason);min-height:1.2em}
      #speech{text-align:center;font-size:var(--speech-fs);color:var(--ink);background:var(--speech-bg);border-radius:14px;padding:8px 14px;max-width:640px;margin:0 auto;border:1px solid transparent}
      html.hc #speech{border-color:var(--btn-border)}
      #session{text-align:center;font-size:calc(var(--chip-fs));color:var(--mute)}
      #keep-row{display:flex;gap:10px;justify-content:center}
      #keep-row #btn-keep{border-color:var(--keep-border);color:var(--keep-ink)}
      #keep-row #btn-undo{border-color:var(--undo-border);color:var(--undo-ink)}
      button:disabled{opacity:.45;cursor:default}
      html.hc #top-bar button,html.hc #chat-bar button,html.hc #chips button,html.hc #keep-row button,html.hc #a11y-bar button{
        border-width:2px;font-weight:700
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="mode-chip">Demo mode — add API key for live chat.</div>
    <div id="privacy">Chat goes to your chosen API host. Nothing stored on our server.</div>
    <div id="top-bar">
      <button id="btn-enter" type="button">Enter XR</button>
      <button id="btn-demo" type="button">Demo tour</button>
      <div id="a11y-bar" role="group" aria-label="Accessibility">
        <button id="btn-contrast" type="button" aria-pressed="false" title="High contrast">Contrast</button>
        <button id="btn-text-down" type="button" aria-label="Smaller text" title="Smaller text">A−</button>
        <button id="btn-text-up" type="button" aria-label="Larger text" title="Larger text">A+</button>
      </div>
    </div>
    <div id="hud">
      <div id="session">Steward did 0 · you kept 0</div>
      <div id="speech">Hi — I'm your Pane Steward. Pick a chip or tell me what you need.</div>
      <div id="reason"></div>
      <div id="chips">
        <button type="button" data-intent="prep">Prep call</button>
        <button type="button" data-intent="park">Park this</button>
        <button type="button" data-intent="next">What's next</button>
      </div>
      <div id="keep-row">
        <button id="btn-keep" type="button" disabled>👍 Keep</button>
        <button id="btn-undo" type="button" disabled>👎 Undo</button>
      </div>
      <div id="chat-bar">
        <input id="chat-input" type="text" placeholder="Type a short ask…" autocomplete="off" aria-label="Chat ask" />
        <button id="btn-send" type="button">Send</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
